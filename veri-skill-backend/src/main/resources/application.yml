spring:
  application:
    name: veri-skill-backend
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/veriskill?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# External Service URLs
flask:
  ai:
    url: http://127.0.0.1:5001

zk:
  proof:
    service:
      url: http://127.0.0.1:3000

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.veriskill: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
